name: Build Pleiada Recorder Installer

on:
  push:
    tags:
      - 'v*'          # triggers on: git tag v0.17 && git push --tags
  workflow_dispatch:  # allows manual trigger from the GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      # ── 1. Checkout source ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1.5. Version unica: el tag es la fuente de verdad ─────────
      #    Falla el build si el tag vX.Y.Z no coincide con VERSION en
      #    pleiada_app.pyw. Exporta APP_VERSION (sin la "v") para que
      #    ISCC la inyecte en ambos instaladores y el manifiesto.
      - name: Validate version consistency
        shell: pwsh
        run: |
          $content = Get-Content "pleiada_installer\files\pleiada_app.pyw" -Raw
          if ($content -notmatch '(?m)(?-i)^VERSION\s*=\s*"v([0-9]+\.[0-9]+(\.[0-9]+)?)"') {
            Write-Error "No se encontro VERSION en pleiada_app.pyw"
            exit 1
          }
          $fileVer = $Matches[1]
          Write-Host "VERSION en pleiada_app.pyw: v$fileVer"
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tagVer = "${{ github.ref_name }}".TrimStart("v")
            if ($tagVer -ne $fileVer) {
              Write-Error "El tag (v$tagVer) no coincide con VERSION en pleiada_app.pyw (v$fileVer). Alinear antes de publicar."
              exit 1
            }
            Write-Host "OK: tag y VERSION coinciden (v$tagVer)"
          }
          echo "APP_VERSION=$fileVer" >> $env:GITHUB_ENV

      # ── 2. Create deps directory ──────────────────────────────────
      - name: Create deps directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "pleiada_installer\deps" | Out-Null

      # ── 3. Download Python 3.12.8 installer ───────────────────────
      - name: Download Python 3.12.8
        shell: pwsh
        run: |
          $dest = "pleiada_installer\deps\python-3.12.8-amd64.exe"
          Write-Host "Downloading Python 3.12.8..."
          Invoke-WebRequest `
            -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-amd64.exe" `
            -OutFile $dest `
            -UseBasicParsing
          $mb = [math]::Round((Get-Item $dest).Length / 1MB, 1)
          Write-Host "Python installer: $mb MB"

      # ── 4. Download AutoHotkey v2.0.24 installer ──────────────────
      #    autohotkey.com is protected by Cloudflare bot challenge.
      #    GitHub Releases also redirects there, so we use the GitHub CLI
      #    (gh) which ships on all runners and downloads release assets
      #    via the authenticated API, bypassing Cloudflare entirely.
      - name: Download AutoHotkey v2.0.24
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "Downloading AutoHotkey v2.0.24 via GitHub CLI..."
          gh release download v2.0.24 `
            --repo AutoHotkey/AutoHotkey `
            --pattern "*setup*" `
            --dir "pleiada_installer\deps" `
            --clobber
          # Normalize filename to what setup.iss expects
          $found = Get-ChildItem "pleiada_installer\deps\*setup*" | Select-Object -First 1
          if (-not $found) { Write-Error "AHK installer not found after download"; exit 1 }
          $target = "pleiada_installer\deps\AutoHotkey_2.0.24_setup.exe"
          if ($found.FullName -ne (Resolve-Path $target -ErrorAction SilentlyContinue)) {
            Move-Item $found.FullName $target -Force
          }
          $mb = [math]::Round((Get-Item $target).Length / 1MB, 1)
          Write-Host "AHK installer: $mb MB"

      # ── 5. Download OBS Studio 32.1.2 installer ───────────────────
      - name: Download OBS Studio 32.1.2
        shell: pwsh
        run: |
          $dest = "pleiada_installer\deps\OBS-Studio-32.1.2-Windows-x64-Installer.exe"
          Write-Host "Downloading OBS Studio 32.1.2..."
          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-studio/releases/download/32.1.2/OBS-Studio-32.1.2-Windows-x64-Installer.exe" `
            -OutFile $dest `
            -UseBasicParsing
          $mb = [math]::Round((Get-Item $dest).Length / 1MB, 1)
          Write-Host "OBS installer: $mb MB"

      # ── 6. Install Inno Setup 6 via Chocolatey ────────────────────
      #    choco is pre-installed on all GitHub Actions Windows runners.
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          Write-Host "Installing Inno Setup via Chocolatey..."
          choco install innosetup --yes --no-progress
          Write-Host "Inno Setup installed."

      # ── 7. Compile the installers (completo + updater LITE) ───────
      - name: Compile installers with ISCC
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using ISCC: $iscc"
          Write-Host "Compilando instalador completo (v$env:APP_VERSION)..."
          & $iscc "/DAppVersion=$env:APP_VERSION" "pleiada_installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC (full) exited with code $LASTEXITCODE"
            exit 1
          }
          Write-Host "Compilando updater LITE (v$env:APP_VERSION)..."
          & $iscc "/DLITE" "/DAppVersion=$env:APP_VERSION" "pleiada_installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC (LITE) exited with code $LASTEXITCODE"
            exit 1
          }

      # ── 7.5. Firma de codigo (SSL.com eSigner / CodeSignTool) ──────
      #    ORDEN CRITICO: la firma modifica los bytes del .exe, asi que
      #    tiene que correr ANTES del paso 9.5 (que calcula los SHA-256
      #    del latest.json). Si se firma despues, el hash del manifiesto
      #    no coincide con el archivo y el auto-update descarta la
      #    descarga en silencio: nadie se puede actualizar.
      #    Runbook completo: FIRMA_CODIGO_SSLCOM.md
      - name: Check signing secrets
        shell: pwsh
        env:
          ES_USERNAME:      ${{ secrets.ES_USERNAME }}
          ES_PASSWORD:      ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET:   ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $faltan = @()
          foreach ($n in 'ES_USERNAME','ES_PASSWORD','ES_CREDENTIAL_ID','ES_TOTP_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($n)) { $faltan += $n }
          }
          if ($faltan.Count -eq 0) {
            Write-Host "Secretos de firma presentes: se van a firmar los dos instaladores."
            echo "SIGNING=on" >> $env:GITHUB_ENV
            return
          }
          $msg = "Faltan secretos de firma en el repo: " + ($faltan -join ', ')
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            Write-Error "$msg. Un release de produccion NO puede salir sin firmar."
            exit 1
          }
          Write-Warning "$msg. Es un build de prueba (no es un tag): se omite la firma."
          echo "SIGNING=off" >> $env:GITHUB_ENV

      - name: Download CodeSignTool
        if: env.SIGNING == 'on'
        shell: pwsh
        run: |
          # Version clavada a proposito. El .zip -windows trae su propio JRE,
          # asi que no depende de la version de Java del runner.
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip"
          $zip  = "$env:RUNNER_TEMP\CodeSignTool.zip"
          $dest = "$env:RUNNER_TEMP\codesigntool"
          Write-Host "Descargando CodeSignTool v1.3.2..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "CodeSignTool: $mb MB"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bat = Get-ChildItem $dest -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1
          if (-not $bat) { Write-Error "No se encontro CodeSignTool.bat dentro del zip"; exit 1 }
          Write-Host "CodeSignTool.bat: $($bat.FullName)"
          echo "CST_DIR=$($bat.DirectoryName)" >> $env:GITHUB_ENV

      - name: Sign installers with eSigner
        if: env.SIGNING == 'on'
        shell: pwsh
        env:
          ES_USERNAME:      ${{ secrets.ES_USERNAME }}
          ES_PASSWORD:      ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET:   ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $outDir    = (Resolve-Path "pleiada_installer\Output").Path
          $signedDir = "$env:RUNNER_TEMP\signed"
          New-Item -ItemType Directory -Force -Path $signedDir | Out-Null
          # CodeSignTool.bat SOLO corre desde su propia carpeta: resuelve sus
          # jars y su JRE con rutas relativas al directorio de trabajo.
          Push-Location $env:CST_DIR
          foreach ($name in @("PleiadaRecorder_Setup.exe", "PleiadaRecorder_Update.exe")) {
            $src    = Join-Path $outDir    $name
            $signed = Join-Path $signedDir $name
            Write-Host "Firmando $name ..."
            & ".\CodeSignTool.bat" sign `
              "-credential_id=$env:ES_CREDENTIAL_ID" `
              "-username=$env:ES_USERNAME" `
              "-password=$env:ES_PASSWORD" `
              "-totp_secret=$env:ES_TOTP_SECRET" `
              "-input_file_path=$src" `
              "-output_dir_path=$signedDir"
            $code = $LASTEXITCODE
            # CodeSignTool no siempre devuelve un exit code distinto de 0 cuando
            # falla, asi que el chequeo que vale es que el archivo firmado exista.
            if ($code -ne 0) { Write-Error "CodeSignTool fallo en $name (codigo $code)"; exit 1 }
            if (-not (Test-Path $signed)) { Write-Error "CodeSignTool no genero el firmado de $name"; exit 1 }
            Move-Item $signed $src -Force
            Write-Host "  OK: $name firmado y reemplazado en Output\"
          }
          Pop-Location

      - name: Verify Authenticode signature
        if: env.SIGNING == 'on'
        shell: pwsh
        run: |
          $fallo = $false
          foreach ($name in @("PleiadaRecorder_Setup.exe", "PleiadaRecorder_Update.exe")) {
            $sig = Get-AuthenticodeSignature "pleiada_installer\Output\$name"
            Write-Host "$name -> $($sig.Status)"
            if ($sig.Status -eq 'NotSigned') {
              Write-Error "  $name quedo SIN firmar"
              $fallo = $true
              continue
            }
            Write-Host "  Firmante: $($sig.SignerCertificate.Subject)"
            if ($sig.TimeStamperCertificate) {
              Write-Host "  Timestamp: $($sig.TimeStamperCertificate.Subject)"
            } else {
              # Sin timestamp la firma deja de validar el dia que vence el
              # certificado (1 anio), incluso en los .exe ya distribuidos.
              Write-Warning "  $name quedo SIN timestamp"
            }
            if ($sig.Status -ne 'Valid') { Write-Warning "  Estado inesperado: $($sig.Status)" }
          }
          if ($fallo) { exit 1 }

      # ── 8. Locate compiled .exe ───────────────────────────────────
      - name: Verify output
        shell: pwsh
        run: |
          $full = "pleiada_installer\Output\PleiadaRecorder_Setup.exe"
          $lite = "pleiada_installer\Output\PleiadaRecorder_Update.exe"
          foreach ($exe in @($full, $lite)) {
            if (-not (Test-Path $exe)) { Write-Error "No se genero $exe"; exit 1 }
            $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
            Write-Host "Built: $exe ($mb MB)"
          }
          echo "EXE_PATH=$((Resolve-Path $full).Path)" >> $env:GITHUB_ENV
          echo "LITE_PATH=$((Resolve-Path $lite).Path)" >> $env:GITHUB_ENV
          # upload-artifact rechaza / \ : " < > | * ? en el nombre del artifact.
          # En un tag (v0.9.14) ref_name no tiene ninguno, pero en un run manual
          # sobre una rama tipo feature/xxx la barra hace fallar el upload — y el
          # run se pone rojo por algo que no tiene nada que ver con el build.
          $safeRef = "${{ github.ref_name }}" -replace '[\\/:"<>|*?]', '-'
          echo "ARTIFACT_NAME=PleiadaRecorder_Setup_$safeRef" >> $env:GITHUB_ENV

      # ── 9. Upload as workflow artifact (versioned, for internal use) ─
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.EXE_PATH }}
            ${{ env.LITE_PATH }}
          retention-days: 30

      # ── 9.5. Manifiesto de auto-update (latest.json) ───────────────
      #    El cliente instalado lo lee desde
      #    releases/latest/download/latest.json para saber si hay una
      #    version nueva, de donde bajarla y su SHA-256.
      #    NO mover este paso antes de la firma (7.5): los hashes se calculan
      #    sobre los .exe YA firmados. Ver el comentario del paso 7.5.
      - name: Generate update manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $minVersion = (Get-Content "pleiada_installer\min_version.txt" -TotalCount 1).Trim()
          $manifest = [ordered]@{
            version          = $tag
            min_version      = $minVersion
            update_url       = "https://github.com/$repo/releases/download/$tag/PleiadaRecorder_Update.exe"
            update_sha256    = (Get-FileHash $env:LITE_PATH -Algorithm SHA256).Hash.ToLower()
            installer_url    = "https://github.com/$repo/releases/download/$tag/PleiadaRecorder_Setup.exe"
            installer_sha256 = (Get-FileHash $env:EXE_PATH -Algorithm SHA256).Hash.ToLower()
            published_at     = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $json = $manifest | ConvertTo-Json
          [System.IO.File]::WriteAllText("latest.json", $json)
          Write-Host $json

      # ── 10. Extraer notas de la version desde CHANGELOG.md ──────────
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "V" + ($tag -replace "v0\.", "")
          $lines = Get-Content "CHANGELOG.md"
          $notes = @()
          $capturing = $false
          foreach ($line in $lines) {
            if ($line -match "^## $version\b") { $capturing = $true; continue }
            if ($capturing -and $line -match "^## ") { break }
            if ($capturing) { $notes += $line }
          }
          $body = ($notes | Out-String).Trim()
          if (-not $body) { $body = "Ver CHANGELOG.md para detalles." }
          $body | Out-File "release_notes.txt" -Encoding utf8

      # ── 11. Publish GitHub Release con nombre de archivo fijo ────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Pleiada Recorder ${{ github.ref_name }}
          body_path: release_notes.txt
          files: |
            ${{ env.EXE_PATH }}
            ${{ env.LITE_PATH }}
            latest.json
          draft: false
          prerelease: false

      # ── 12. Borrar .exe y manifiestos de releases anteriores ──────────
      - name: Remove exe from previous releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ github.ref_name }}"
          $tags = gh release list --repo ${{ github.repository }} --json tagName | ConvertFrom-Json | Select-Object -ExpandProperty tagName
          foreach ($tag in $tags) {
            if ($tag -ne $currentTag) {
              $assets = gh release view $tag --repo ${{ github.repository }} --json assets | ConvertFrom-Json | Select-Object -ExpandProperty assets
              foreach ($asset in $assets) {
                if (($asset.name -like "*.exe") -or ($asset.name -eq "latest.json")) {
                  Write-Host "Eliminando $($asset.name) de release $tag..."
                  gh release delete-asset $tag $asset.name --yes --repo ${{ github.repository }}
                }
              }
            }
          }
